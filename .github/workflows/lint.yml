name: lint
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  eslint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - run: yarn install
      - run: yarn run lint
